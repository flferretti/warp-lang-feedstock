MACOSX_SDK_VERSION:   # [osx and x86_64]
  - "11.0"            # [osx and x86_64]

# The prebuilt LLVM SDK for aarch64 uses manylinux_2_34.
# Override the complete zipped compiler matrix (CPU, CUDA 12, CUDA 13).
c_compiler_version:   # [linux and aarch64]
  - "15"             # [linux and aarch64]
  - "14"             # [linux and aarch64]
  - "15"             # [linux and aarch64]
cxx_compiler_version:  # [linux and aarch64]
  - "15"             # [linux and aarch64]
  - "14"             # [linux and aarch64]
  - "15"             # [linux and aarch64]
fortran_compiler_version:  # [linux and aarch64]
  - "15"             # [linux and aarch64]
  - "14"             # [linux and aarch64]
  - "15"             # [linux and aarch64]
cuda_compiler_version:  # [linux and aarch64]
  - "None"           # [linux and aarch64]
  - "12.9"           # [linux and aarch64]
  - "13.0"           # [linux and aarch64]
c_stdlib_version:     # [linux and aarch64]
  - "2.34"           # [linux and aarch64]
  - "2.34"           # [linux and aarch64]
  - "2.34"           # [linux and aarch64]
